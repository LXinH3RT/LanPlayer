# Builds every platform we support.  The native dependencies are fetched and
# compiled here, which is exactly the part that cannot be verified offline.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FFMPEG_VERSION: "6.1.1"
  LIBSMB2_VERSION: "v4.0.0"

jobs:
  native-desktop:
    name: native core (Linux, stub platform)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm pkg-config \
            libsmbclient-dev libssl-dev
      - name: build ffmpeg (shared)
        run: |
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cd ffmpeg-$FFMPEG_VERSION
          ./configure --prefix=$PWD/../ff-out --enable-shared --disable-static \
            --disable-programs --disable-doc --enable-gpl \
            --enable-filter=atempo,yadif,scale,format,aresample
          make -j$(nproc) && make install
      - name: configure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ff-out/lib
        run: |
          # The CMake project root is native/, not the repository root: there is
          # no top-level CMakeLists.txt on purpose (the app has its own one).
          cmake -S native -B build -G Ninja \
            -DLP_FFMPEG_ROOT=${{ github.workspace }}/ff-out \
            -DLP_NO_TESTS=OFF
      - name: build
        run: cmake --build build
      - name: smoke test (ABI + load)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ff-out/lib
        run: ./build/lp_smoke_test
      - name: static checks
        run: |
          python3 tool/check_symbols.py
          python3 tool/check_c_syntax.py

  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      - name: locate the Android NDK
        # build_android_deps.sh refuses to run without ANDROID_NDK_HOME; the
        # runner image ships several NDKs under $ANDROID_HOME/ndk but does not
        # export the variable.  Prefer the one pinned in build.gradle.kts and
        # install it if the image does not carry that exact version.
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/26.1.10909125"
          if [ ! -d "$NDK" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" || true
          fi
          if [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "no NDK found under $SDK/ndk" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"
          # Gradle only accepts the NDK version named in build.gradle.kts.
          echo "LP_ANDROID_NDK=$(basename "$NDK")" >> "$GITHUB_ENV"
      - name: build ffmpeg + libsmb2 for Android
        # `bash <script>` instead of `<script>`: the executable bit is not part
        # of this repository's history on every checkout (core.fileMode is off
        # on the Windows machine the tree was mostly authored on), so running
        # the file directly fails with "Permission denied" / exit code 126.
        #
        # Only arm64-v8a: the APK below is built with --target-platform
        # android-arm64, and every extra ABI doubles the FFmpeg cross-build
        # (which dominates this job's runtime).  Pass "armeabi-v7a" as well to
        # ship 32-bit ARM; app/build.gradle.kts lists the same set.
        run: bash scripts/build_android_deps.sh arm64-v8a
      - name: analyze + test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: build apk
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

  apple:
    name: apple (iOS build only)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      - name: build ffmpeg + libsmb2 for Apple
        # `bash <script>`: see the note in the android job - the executable bit
        # is not reliable in this repository's history.
        #
        # SLICES=iphoneos only: on Apple silicon iphoneos / iphonesimulator /
        # macosx are all arm64, and lipo refuses to pack two slices with the same
        # architecture into one fat archive.  This job only builds the iOS app,
        # so the device slice is all it needs.
        run: SLICES=iphoneos bash scripts/build_apple_deps.sh
      - name: analyze + test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: build ios (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

  windows-native:
    name: windows x64 native core (zig toolchain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch toolchain and dependencies
        # No `crypto`/`typed_data`/`collection` any more: those were only needed
        # by the share-key codec, which has been removed.  tool/fetch_deps.py
        # exits with "unknown artifact <name>" for them.
        run: python tool/fetch_deps.py zig ffmpeg libsmb2 dart
      - name: build (dll + smoke test, SMB included)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -Clean
      - name: test media + runtime check
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make_test_media.ps1
          build\win-x64\lp_smoke_test.exe
          build\win-x64\lp_smoke_test.exe --list .
          build\win-x64\lp_smoke_test.exe build\media\clip.mp4 6
          build\win-x64\lp_smoke_test.exe build\media\subbed.mkv 6
      - name: static + dart + runtime suite
        run: python tool/check_all.py

  windows-app:
    name: windows desktop app (flutter + MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - name: native core (DLL with the win32 adapter)
        run: |
          python tool/fetch_deps.py zig ffmpeg libsmb2
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -Clean
      - name: fetch the rest of the analysis/desktop deps
        run: python tool/fetch_deps.py dart ffi path_provider
      - name: analyze + unit tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: build the desktop app
        # Deliberately NOT `flutter build windows`: flutter_tools 3.27.4 picks
        # its CMake generator from a hard-coded switch that only knows VS 16/17
        # (packages/flutter_tools/lib/src/windows/visual_studio.dart,
        # cmakeGenerator -> `_ => 'Visual Studio 16 2019'`).  windows-latest has
        # been the `windows-2025-vs2026` image since late 2025, i.e. Visual
        # Studio 18 only, so configure dies with
        #   Generator Visual Studio 16 2019 could not find any instance ...
        # This script runs the same CMake + MSBuild steps but asks the
        # `cmake --help` of the installed Visual Studio for the generator name
        # and builds the CMake project directly, so no flutter_tools patch or
        # snapshot rebuild is needed.  It also creates the plugin junctions that
        # `flutter pub get` wants to symlink, and copies lanplayer.dll + the
        # FFmpeg DLLs next to the exe.
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_desktop.ps1 `
            -Config Release -NoEnvRedirect
      - name: bundle check (exe + core + engine + assets)
        run: |
          $exe = Get-ChildItem -Path app\windows\out\build -Recurse -Filter lanplayer.exe -File |
            Where-Object { $_.Directory.Name -eq 'Release' } |
            Select-Object -First 1
          if (-not $exe) { throw 'lanplayer.exe was not produced' }
          $bundle = $exe.DirectoryName
          Write-Host "bundle: $bundle"
          foreach ($f in 'lanplayer.exe', 'lanplayer.dll', 'lanplayer_video_plugin.dll',
                         'flutter_windows.dll', 'icudtl.dat') {
            if (-not (Test-Path (Join-Path $bundle $f))) { throw "missing $f in $bundle" }
          }
          if (-not (Test-Path (Join-Path $bundle 'data\flutter_assets'))) {
            throw "missing data\flutter_assets in $bundle"
          }
          if (-not (Test-Path (Join-Path $bundle 'data\app.so'))) {
            throw "missing data\app.so (AOT kernel) in $bundle"
          }
          Get-ChildItem $bundle -File | Sort-Object Name |
            ForEach-Object { Write-Host ("  {0,-32} {1,9:N0} KiB" -f $_.Name, ($_.Length / 1KB)) }
      - name: texture path preflight (loads lanplayer.dll)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make_test_media.ps1
          build\win-x64\lp_win32_texture_test.exe build\media\clip.mp4 build\win-x64
      - name: hardware decode preflight (d3d11va when the runner has a GPU)
        run: |
          build\win-x64\lp_hw_decode_test.exe build\media\colortest\red.mp4 --expect-red --allow-software


