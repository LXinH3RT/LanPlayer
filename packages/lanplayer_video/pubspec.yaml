name: lanplayer_video
description: Windows texture bridge for the LanPlayer FFmpeg core (liblanplayer.dll).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: LanPlayerVideoPlugin
