name: lanplayer
description: 跨平台局域网播放器：SMB 浏览 + FFmpeg 硬解内核（dart:ffi）。
publish_to: "none"
version: 0.1.6+7
environment:
  sdk: ">=3.4.0 <4.0.0"
  # CardThemeData, Color.withValues and TextScaler need Flutter 3.27+.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # dart:ffi helpers (Utf8, malloc, ...)
  ffi: ^2.1.2
  # Application support directory for the profile / settings / progress stores
  path_provider: ^2.1.3
  # Windows texture bridge (Flutter desktop). Android/iOS hosts implement the
  # same method channel natively, so this package is inert there.
  lanplayer_video:
    path: ../packages/lanplayer_video
  # iOS / macOS: 把 C 内核（native/）通过 CocoaPods 静态链进 Runner。
  # 本包没有 Dart 代码，只有 ios/ 与 macos/ 下的 podspec；Windows / Android
  # 构建时它不参与任何事。
  lanplayer_core:
    path: ../packages/lanplayer_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 启动动画用的图标：从 AppIcon 去掉白底、按内容裁边后缩到 512 px。
    - assets/branding/splash_logo.png
    # MiSans 的许可证与来源声明。Apache License 2.0 要求再分发时把许可证
    # 与声明一起带上，所以让它们随安装包落到 data/flutter_assets 下，而不是
    # 只留在仓库里。
    - assets/fonts/MiSans-LICENSE.txt
    - assets/fonts/NOTICE.txt
  fonts:
    # 界面统一用 MiSans（小米开源，Apache-2.0 的 MiSans 变体）。
    # 系统默认字体族在 Windows 上没有中文字形，中文要落到 fallback 链上，
    # 于是同一句里的「音」「轨」「关」「闭」会被换成另一套字，看起来像
    # 字体坏了。打包一份自带 CJK 的字体后中英混排一致。
    # 这是可变字体（fvar/gvar），Flutter 直接用默认实例，需要粗体时合成。
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSansVF.ttf
