name: lanplayer
description: 跨平台局域网播放器：SMB 浏览 + FFmpeg 硬解内核（dart:ffi）。
publish_to: "none"
version: 0.1.5+6
environment:
  sdk: ">=3.4.0 <4.0.0"
  # CardThemeData, Color.withValues and TextScaler need Flutter 3.27+.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # dart:ffi helpers (Utf8, malloc, ...)
  ffi: ^2.1.2
  # Application support directory for the profile / settings / progress stores
  path_provider: ^2.1.3
  # Windows texture bridge (Flutter desktop). Android/iOS hosts implement the
  # same method channel natively, so this package is inert there.
  lanplayer_video:
    path: ../packages/lanplayer_video
  # iOS / macOS: 把 C 内核（native/）通过 CocoaPods 静态链进 Runner。
  # 本包没有 Dart 代码，只有 ios/ 与 macos/ 下的 podspec；Windows / Android
  # 构建时它不参与任何事。
  lanplayer_core:
    path: ../packages/lanplayer_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
